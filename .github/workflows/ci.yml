name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (go test + gofmt + pii)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            .build/go-cache
            .build/go-mod-cache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

      - name: gofmt (check)
        run: |
          set -euo pipefail
          bad="$(gofmt -l . | head -n 1 || true)"
          if [[ -n "$bad" ]]; then
            echo "gofmt required (example): $bad" >&2
            exit 1
          fi

      - name: Test
        run: make test

      - name: PII scan
        run: bash scripts/pii_scan.sh

  build-linux:
    name: Build Linux (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup QEMU (for linux/arm64 proxychains build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            .build/go-cache
            .build/go-mod-cache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

      - name: Cache deps (mihomo/proxychains)
        uses: actions/cache@v4
        with:
          path: |
            third_party/mihomo
            third_party/proxychains
          key: ${{ runner.os }}-deps-${{ hashFiles('Makefile') }}

      - name: Fetch deps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make deps

      - name: Build packages
        run: |
          set -euo pipefail
          make linux/amd64
          test -f dist/clash4cli-linux-amd64-$(cat VERSION)/c4cd
          make linux/arm64
          test -f dist/clash4cli-linux-arm64-$(cat VERSION)/c4cd

      - name: Build deb/rpm
        run: |
          set -euo pipefail
          ./scripts/package_nfpm.sh --arch amd64 --packager deb,rpm
          ./scripts/package_nfpm.sh --arch arm64 --packager deb,rpm

  build-darwin:
    name: Build macOS (amd64 + arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            .build/go-cache
            .build/go-mod-cache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

      - name: Cache deps (mihomo/proxychains)
        uses: actions/cache@v4
        with:
          path: |
            third_party/mihomo
            third_party/proxychains
          key: ${{ runner.os }}-deps-${{ hashFiles('Makefile') }}

      - name: Fetch deps
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make deps

      - name: Build packages
        run: |
          set -euo pipefail
          make darwin/amd64
          test -f dist/clash4cli-darwin-amd64-$(cat VERSION)/c4cd
          make darwin/arm64
          test -f dist/clash4cli-darwin-arm64-$(cat VERSION)/c4cd

