name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build-linux-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup QEMU (for linux/arm64 deps)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Read version
        run: |
          set -euo pipefail
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            .build/go-cache
            .build/go-mod-cache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

      - name: Cache deps (mihomo/proxychains)
        uses: actions/cache@v4
        with:
          path: |
            third_party/mihomo
            third_party/proxychains
          key: ${{ runner.os }}-deps-${{ hashFiles('Makefile') }}

      - name: Fetch deps
        run: make deps

      - name: Build package
        run: make linux/amd64

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: dist/*.tar.gz

  build-linux-arm64:
    name: Build linux/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup QEMU (for linux/arm64 proxychains build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Read version
        run: |
          set -euo pipefail
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            .build/go-cache
            .build/go-mod-cache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

      - name: Cache deps (mihomo/proxychains)
        uses: actions/cache@v4
        with:
          path: |
            third_party/mihomo
            third_party/proxychains
          key: ${{ runner.os }}-deps-${{ hashFiles('Makefile') }}

      - name: Fetch deps
        run: make deps

      - name: Build package
        run: make linux/arm64

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: dist/*.tar.gz

  build-darwin:
    name: Build darwin (amd64 + arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        run: |
          set -euo pipefail
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            .build/go-cache
            .build/go-mod-cache
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}

      - name: Cache deps (mihomo/proxychains)
        uses: actions/cache@v4
        with:
          path: |
            third_party/mihomo
            third_party/proxychains
          key: ${{ runner.os }}-deps-${{ hashFiles('Makefile') }}

      - name: Fetch deps
        run: make deps

      - name: Build darwin/amd64 package
        run: make darwin/amd64

      - name: Build darwin/arm64 package
        run: make darwin/arm64

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin
          path: dist/*.tar.gz

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PII scan
        run: bash scripts/pii_scan.sh

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute tag
        run: |
          set -euo pipefail
          ver="$(cat VERSION)"
          echo "TAG=v${ver}" >> "$GITHUB_ENV"
          echo "VERSION=${ver}" >> "$GITHUB_ENV"

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          ls -la
          sha256sum *.tar.gz > SHA256SUMS

      - name: Prepare release notes
        run: |
          set -euo pipefail
          : > release-notes.md
          bash scripts/extract_changelog.sh "$TAG" > release-notes.md || true

      - name: Publish (skip if exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          title="clash4cli ${TAG}"
          files=(dist/*.tar.gz dist/SHA256SUMS)

          if [[ -n "$(tr -d '[:space:]' < release-notes.md || true)" ]]; then
            gh release create "$TAG" "${files[@]}" --title "$title" --notes-file release-notes.md
          else
            gh release create "$TAG" "${files[@]}" --title "$title" --generate-notes
          fi
